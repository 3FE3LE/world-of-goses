# CI for World of Goses — Architecture Hardening A0 guardrails.
#
# Runs the official build, the full xUnit suite, and the repo-local
# validators that AGENTS.md §5 marks as path-gated or core checks.
# Wired deliberately small: no visual matrix, no full snapshot, no
# docs scripts. Those belong to later CI increments.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref so fast-follow pushes do not
# pile up queued runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test + validators
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # .NET 8.0 is the project pin (game/ targets net8.0; tests use
      # RollForward=LatestMajor so any newer SDK also works). Pinned
      # here so CI does not silently upgrade between runs.
      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Godot 4.7.1 .NET is required because game/ uses Godot.NET.Sdk/4.7.1
      # and the test project's ProjectReference pulls the game project
      # in. CI installs Godot fresh on every run; the local machine
      # keeps its own copy under C:\Tools\Godot\.
      #
      # The action's current action.yml (v1.5.6, SHA d3fbddf…) honors
      # `use-dotnet` (default true) and `include-templates` (default
      # false). The legacy `mono`, `include-export-templates` and
      # `include-dotnet` inputs no longer exist; pinning to a tagged
      # release means the toolchain does not silently change when
      # upstream ships another v1.
      - name: Setup Godot 4.7.1 (mono)
        uses: chickensoft-games/setup-godot@v1.5.6
        with:
          version: 4.7.1
          use-dotnet: true

      # Make the resolved toolchain visible in the CI log instead of
      # trusting action defaults. If `use-dotnet` ever stops working as
      # a build of the .NET-enabled binary, `godot --version` plus
      # `dotnet --list-sdks` makes the regression obvious before a
      # silent xUnit failure points at it. `$env:GODOT` is what the
      # setup-godot action exports; bare `godot` falls back to PATH.
      - name: Verify Godot and .NET toolchain
        shell: pwsh
        run: |
          $godot = $env:GODOT
          if (-not $godot) { $godot = (Get-Command godot -ErrorAction SilentlyContinue).Source }
          if (-not $godot) { Write-Error "godot executable not found in PATH and $env:GODOT not set"; exit 1 }
          Write-Output "Godot binary: $godot"
          & $godot --version
          $sdk = dotnet --list-sdks | Select-String '^8\.'
          if (-not $sdk) { Write-Error ".NET 8 SDK required but absent from 'dotnet --list-sdks'"; exit 1 }
          Write-Output "Dotnet 8 SDK entries:"; $sdk | ForEach-Object { Write-Output ("  " + $_) }

      # AGENTS.md §5 path-gated check for any diff touching the agent
      # context layer. Cheap (sub-second) when nothing drifted; runs
      # unconditionally for a first CI.
      - name: Sync agent context
        shell: pwsh
        run: pwsh ./scripts/Sync-AgentContext.ps1 -Apply

      - name: Validate agent context
        shell: pwsh
        run: pwsh ./scripts/Validate-AgentContext.ps1

      # AGENTS.md §5 core check: build the Godot .NET project.
      #
      # --no-incremental so the warning count CI reports comes from a real
      # compilation. An incremental build over a warm tree recompiles
      # nothing and still prints "0 Warning(s)", which is how a baseline
      # starts lying. -warnaserror holds the zero-warning baseline the
      # exit gate reached: a new CS8602 or a resurrected CS2002 fails here
      # rather than accumulating quietly.
      - name: Build game project
        working-directory: game
        run: dotnet build --configuration Debug --no-incremental -warnaserror

      # AGENTS.md §5 core check: run the xUnit domain/persistence suite.
      # --no-build because the previous step already produced binaries.
      #
      # First-time imports are an xUnit concern. The
      # PromotedSpeedGlyphs guard asserts the existence of three
      # `.import` siblings that `.gitignore` correctly keeps out of
      # source control; without a canonical reimport the guard would
      # fail simply because the runner had no prior Godot session.
      # Reimport first, then test.
      - name: Canonical import of game assets
        shell: pwsh
        run: pwsh ./tools/Import-GameAssets.ps1

      - name: Run xUnit tests
        working-directory: tests/WorldofGoses.Tests
        run: dotnet test --no-build --configuration Debug

      # The edge xUnit cannot reach. Compilation and unit tests never touch
      # Godot's lifecycle, scene composition, _Ready() or signals: A9 shipped
      # a build-green, 1323-tests-green repository whose game could not boot
      # at all. This step launches the real production main scene headless,
      # with the visual-capture harness off, and fails on a stack overflow,
      # an engine/script error, an unhandled managed exception, or a scene
      # that never reaches its startup path.
      #
      # Same script tools/New-SessionSnapshot.ps1 -Mode Full runs, on purpose.
      - name: Normal Godot boot (smoke)
        shell: pwsh
        run: pwsh ./tools/Test-GodotBoot.ps1

      # AGENTS.md §5 path-gated check for any diff touching locale.
      # Sub-second; cheap enough to run unconditionally.
      - name: Validate localization catalog
        shell: pwsh
        run: pwsh ./tools/Test-LocalizationCatalog.ps1

      # Cheap drift guard for the docs that the rest of the repo cites as
      # truth (schema number, CI surface acknowledgement, session-state
      # baseline). Sub-second; no Godot, no network. Issues #57 closed.
      - name: Validate documentation consistency
        shell: pwsh
        run: pwsh ./tools/Test-DocsConsistency.ps1